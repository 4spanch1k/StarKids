name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: star_kids_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d star_kids_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Upgrade test database
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
        run: python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          ADMISSION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          ONBOARDING_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          BIRTHDAY_LEAD_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          LOYALTY_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          PUSH_CAMPAIGNS_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          BIRTHDAY_REMINDERS_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
          NOTIFICATION_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/star_kids_test
        run: python -m unittest discover -s app/tests -p 'test_*.py'

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin_panel/package-lock.json
      - name: Build admin panel
        working-directory: admin_panel
        run: npm ci && npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test mobile app
        working-directory: mobile_app
        run: flutter pub get && flutter analyze lib test && flutter test
