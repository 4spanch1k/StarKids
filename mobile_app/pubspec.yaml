name: star_kids_mobile
description: Parent-facing mobile app for Star Kids Shymkent.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  http_parser: ^4.1.2
  image_cropper: ^8.1.0
  image_picker: ^1.1.2
  package_info_plus: ^8.0.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  google_fonts: ^6.2.1
  intl: ^0.20.2
  confetti: ^0.7.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
