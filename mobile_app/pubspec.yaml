name: star_kids_mobile
description: Parent-facing mobile app for Star Kids Shymkent.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  http_parser: ^4.1.2
  image_cropper: ^8.1.0
  image_picker: ^1.1.2
  package_info_plus: ^8.0.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
