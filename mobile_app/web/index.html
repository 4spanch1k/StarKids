<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta name="description" content="Star Kids mobile experience for parents.">
  <meta name="theme-color" content="#F46A4E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Star Kids">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Star Kids</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff8f1;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #171316;
    }

    .app-loading {
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .app-loading__shell {
      position: relative;
      width: min(176px, 52vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .app-loading__dots {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      justify-content: center;
    }

    .app-loading__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #F46A4E;
      opacity: 0.25;
      animation: app-dot-pulse 1.4s ease-in-out infinite;
    }

    .app-loading__dot:nth-child(2) { animation-delay: 0.22s; }
    .app-loading__dot:nth-child(3) { animation-delay: 0.44s; }

    @keyframes app-dot-pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50%       { opacity: 0.80; transform: scale(1.0); }
    }

    .app-loading__logo {
      width: calc(100% - 28px);
      aspect-ratio: 1;
      background: #fff;
      border-radius: 999px;
      padding: 6px;
      box-sizing: border-box;
      box-shadow: 0 10px 24px rgba(23, 19, 22, 0.08);
    }

    .app-loading__logo img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 999px;
      object-fit: cover;
    }

</style>
</head>
<body>
  <div class="app-loading" aria-label="Loading Star Kids">
    <div>
      <div class="app-loading__shell">
        <div class="app-loading__logo">
          <img
            src="assets/assets/images/645959303_17890733316429584_1469844678684572952_n.jpg"
            alt="Star Kids logo"
          >
        </div>
      </div>
      <div class="app-loading__dots">
        <div class="app-loading__dot"></div>
        <div class="app-loading__dot"></div>
        <div class="app-loading__dot"></div>
      </div>
    </div>
  </div>
  <script>
    // The Clerk Flutter package currently brings in passkeys_web transitively.
    // Star Kids does not use passkeys, but the web plugin registration expects
    // this global to exist before Flutter starts. Keep it local and no-op so
    // email/password and Google auth can boot normally on web.
    window.PasskeyAuthenticator = window.PasskeyAuthenticator || {
      init: function () {},
      register: function () {
        return Promise.reject(JSON.stringify({
          code: 'unavailable',
          message: 'Passkeys are not configured for this app.',
          details: ''
        }));
      },
      login: function () {
        return Promise.reject(JSON.stringify({
          code: 'unavailable',
          message: 'Passkeys are not configured for this app.',
          details: ''
        }));
      },
      cancelCurrentAuthenticatorOperation: function () {},
      isUserVerifyingPlatformAuthenticatorAvailable: function () {
        return Promise.resolve(false);
      },
      isConditionalMediationAvailable: function () {
        return Promise.resolve(false);
      },
      hasPasskeySupport: function () {
        return false;
      }
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
